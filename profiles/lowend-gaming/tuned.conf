# ============================================================
# /etc/tuned/profiles/lowend-gaming/tuned.conf
# AMD A4-9125 (acpi-cpufreq, no EPP, no platform_profile)
# Storage: nvme0n1 (root) | Target: FPS stabil, no power saving
# ============================================================

[main]
summary=AMD A4-9125 low-end: stabil FPS gaming + daily

# ---------- CPU ----------
[cpu]
priority=10
governor=performance
energy_perf_bias=performance
force_latency=99
boost=1
min_perf_pct=100
max_perf_pct=100

# ---------- DISK (NVMe) ----------
[disk]
readahead=>4096
elevator=none
devices=nvme0n1

# ---------- VM ----------
[vm]
transparent_hugepages=madvise

# ---------- SYSCTL ----------
[sysctl]
vm.swappiness=10
vm.vfs_cache_pressure=50
vm.min_free_kbytes=65536
vm.dirty_ratio=15
vm.dirty_background_ratio=5
vm.dirty_expire_centisecs=3000
vm.dirty_writeback_centisecs=1500
vm.page-cluster=0
vm.stat_interval=10
kernel.sched_autogroup_enabled=1
fs.inotify.max_user_watches=524288
fs.inotify.max_user_instances=256

# ---------- SCHEDULER ----------
[scheduler]
sched_min_granularity_ns=3000000
sched_wakeup_granularity_ns=4000000
sched_migration_cost_ns=5000000
sched_latency_ns=12000000
