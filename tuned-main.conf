# Global tuned configuration file.
# Tuned untuk AMD A4-9125 | no-daemon mode | reapply_sysctl=1

# ============================================================
# NO-DAEMON MODE
# ============================================================
daemon = 0
dynamic_tuning = 0

# ============================================================
# TIMING (tidak dipakai saat daemon=0, tapi biarkan aman)
# ============================================================
sleep_interval = 1
update_interval = 10

# ============================================================
# RECOMMEND — dimatikan supaya TuneD tidak pernah override
# profile manual kamu (mencegah drift ke balanced/MPG)
# ============================================================
recommend_command = 0

# ============================================================
# SYSCTL — PENTING!
# reapply_sysctl = 1 → TuneD akan re-apply /etc/sysctl.d/ SETELAH
# TuneD sysctl. Artinya file /etc/sysctl.d/99-lowend.conf kamu
# MENANG atas sysctl yang di-set oleh profile TuneD.
# ============================================================
reapply_sysctl = 1

# ============================================================
# INSTANCE DEFAULTS
# ============================================================
default_instance_priority = 0
udev_buffer_size = 1MB

# ============================================================
# LOG
# ============================================================
log_file_count = 2
log_file_max_size = 1MB

# ============================================================
# ARCHITECTURE PRESET
# ============================================================
uname_string = x86_64

# ============================================================
# PROFILE DIRS
# ============================================================
profile_dirs = /usr/lib/tuned/profiles,/etc/tuned/profiles

# ============================================================
# UDEV SETTLE — 0 = jangan tunggu, biar boot cepat
# ============================================================
startup_udev_settle_wait = 0
